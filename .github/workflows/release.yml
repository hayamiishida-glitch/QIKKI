name: Release Desktop Apps (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 1.1.4). Leave blank to use package.json version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Publish macOS (DMG + Auto-Update ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Sync GitHub repository & version for auto-updater
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            node scripts/sync-publish-repo.mjs --version "$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/sync-publish-repo.mjs --version "$REF_NAME"
          else
            node scripts/sync-publish-repo.mjs
          fi

      - name: Build web bundle
        run: npm run build

      - name: Install Electron packager
        run: npm install --no-save electron@^35.0.0 electron-builder@^26.0.12 --legacy-peer-deps --no-audit --no-fund

      - name: Build & Publish macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --mac dmg zip --universal --publish always

  build-windows:
    name: Build & Publish Windows (NSIS Auto-Updater + Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Sync GitHub repository & version for auto-updater
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            node scripts/sync-publish-repo.mjs --version "$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/sync-publish-repo.mjs --version "$REF_NAME"
          else
            node scripts/sync-publish-repo.mjs
          fi

      - name: Build web bundle
        run: npm run build

      - name: Install Electron packager
        run: npm install --no-save electron@^35.0.0 electron-builder@^26.0.12 --legacy-peer-deps --no-audit --no-fund

      - name: Build & Publish Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --x64 --publish always
